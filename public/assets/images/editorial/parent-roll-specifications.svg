<path d="M882 190h36m-36 340h36" stroke="#d65a1c" stroke-width="2"/><path d="M905 198v324" stroke="#d65a1c" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="940" y="351" font-family="Arial,sans-serif" font-size="24" fill="#9a3f14">Outside</text><text x="940" y="384" font-family="Arial,sans-serif" font-size="24" fill="#9a3f14">diameter</text>
