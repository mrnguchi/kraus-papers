<rect width="1200" height="720" fill="#e9eeea"/><path d="M48 76h1104M48 650h1104" stroke="#cbd6ce"/>
<text x="50" y="53" font-family="Arial,sans-serif" font-size="17" letter-spacing="3" fill="#51645a">KRAUS PAPERS / CONVERTING NOTES</text>
